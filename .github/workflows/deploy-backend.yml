name: Backend CI/CD - Deploy to Amazon Lightsail

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to Lightsail
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build production JAR (Maven)
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Copy JAR to Lightsail via SSH/SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "backend/target/*.jar"
          target: "/home/ubuntu/app/cozy-dating-backend/build"
          strip_components: 2

      - name: Restart Systemd Service on Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # Crear directorio base si no existe
            mkdir -p /home/ubuntu/app/cozy-dating-backend/

            # Copiar el JAR ejecutable principal a la ruta fija
            find /home/ubuntu/app/cozy-dating-backend/build/ -name "*.jar" ! -name "*.jar.original" -exec cp {} /home/ubuntu/app/cozy-dating-backend/cozy-dating-backend.jar \;

            # Reiniciar el servicio systemd para aplicar la actualizacion
            sudo systemctl restart cozy-dating-backend.service
