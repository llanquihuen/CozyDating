server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cozy_dating?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# JWT Secret for Session Verification (256-bit key)
jwt.secret=cozy_dating_very_secret_key_1234567890_cozy_dating_very_secret_key

# LiveKit Configuration
livekit.api.key=cozy_livekit_key_dev
livekit.api.secret=cozy_livekit_secret_dev
livekit.host=http://localhost:7880

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Storage Configuration (Strategy: local vs s3)
# In local dev: storage.type=local (default). Files are saved to ./uploads and served at /media/**
# In production: set STORAGE_TYPE=s3 and define the AWS/Lightsail environment variables
storage.type=${STORAGE_TYPE:local}
storage.local.dir=uploads/
storage.local.base-url=${LOCAL_MEDIA_URL:http://localhost:8080/media}

# Lightsail S3 Configuration (Used when storage.type=s3)
storage.s3.bucket-name=${LIGHTSAIL_BUCKET_NAME:}
storage.s3.region=${AWS_REGION:us-east-1}
storage.s3.endpoint=${LIGHTSAIL_ENDPOINT:}
storage.s3.access-key=${AWS_ACCESS_KEY_ID:}
storage.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
storage.s3.public-base-url=${LIGHTSAIL_PUBLIC_URL:}

